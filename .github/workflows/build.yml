name: Build Racha APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Decode Keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > /tmp/release-key.jks

      - name: Build Release APK
        env:
          KEYSTORE_PATH: /tmp/release-key.jks
          SIGNING_KEY_ALIAS: ${{ secrets.ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: gradle assembleRelease

      - name: Cleanup Keystore
        if: always()
        run: rm -f /tmp/release-key.jks

      - name: Delete old artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: racha-skeleton-apk
          failOnError: false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: racha-skeleton-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1
